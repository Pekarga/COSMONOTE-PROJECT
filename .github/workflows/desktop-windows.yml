name: Installateur Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Construire l'appli web
        run: |
          npm ci
          npm run build
          npm run desktop:prepare

      - name: Construire l'installateur
        working-directory: desktop
        run: |
          npm ci
          npm run dist:win

      - name: Garder l'installateur comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: Le-redacteur-Windows
          path: desktop/dist/*.exe

      - name: Publier dans une release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Le rédacteur ${{ github.ref_name }}
          files: desktop/dist/*.exe
          body: |
            Installateur Windows de « Le rédacteur ».

            Télécharge `Le-redacteur-Setup-*.exe` ci-dessous, puis double-clique dessus.
            Windows peut afficher « Windows a protégé votre ordinateur » : clique sur « Informations complémentaires », puis « Exécuter quand même ».
