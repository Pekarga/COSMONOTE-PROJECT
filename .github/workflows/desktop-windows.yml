name: Installateur Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 0.1.0). Laisser vide pour ne pas publier de release."
        required: false
        default: ""
      modele:
        description: "Essayer aussi le modèle de rédaction (téléchargement de 5,2 Go, puis une rédaction complète)."
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Construire l'appli web
        run: |
          npm ci
          npm run build
          npm run desktop:prepare

      # Moteur du modèle de rédaction : dernière version de llama.cpp pour Windows (processeur, x64),
      # avec les bibliothèques d'exécution de Visual C++ pour les postes qui ne les ont pas.
      - name: Ajouter le moteur du modèle (llama.cpp)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Dernière version qui publie l'archive Windows pour processeur (x64) ; toutes n'en ont pas.
          $rel = $null; $asset = $null
          $tags = gh release list --repo ggml-org/llama.cpp --limit 40 --exclude-drafts --exclude-pre-releases --json tagName | ConvertFrom-Json
          foreach ($t in $tags) {
            $r = gh release view $t.tagName --repo ggml-org/llama.cpp --json tagName,assets | ConvertFrom-Json
            $a = $r.assets | Where-Object { $_.name -match '^llama-.*-bin-win-cpu-x64\.zip$' } | Select-Object -First 1
            if (-not $a) {
              $a = $r.assets | Where-Object { $_.name -match 'win' -and $_.name -match 'x64' -and $_.name -match '\.zip$' -and $_.name -notmatch 'cuda|cudart|vulkan|hip|sycl|opencl|arm64|kompute' } | Select-Object -First 1
            }
            if ($a) { $rel = $r; $asset = $a; break }
            "  $($r.tagName) : pas d'archive Windows pour processeur ($(($r.assets | Select-Object -ExpandProperty name) -join ', '))"
          }
          if (-not $asset) { throw "Archive Windows de llama.cpp introuvable dans les 40 dernières versions" }
          "llama.cpp $($rel.tagName) : $($asset.name)"
          gh release download $rel.tagName --repo ggml-org/llama.cpp --pattern $asset.name --dir $env:RUNNER_TEMP
          $tmp = Join-Path $env:RUNNER_TEMP "llama"
          Expand-Archive (Join-Path $env:RUNNER_TEMP $asset.name) -DestinationPath $tmp -Force
          $exe = Get-ChildItem $tmp -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $exe) { throw "llama-server.exe absent de $($asset.name)" }
          New-Item -ItemType Directory -Force desktop/llama | Out-Null
          Copy-Item $exe.FullName desktop/llama/
          Copy-Item (Join-Path $exe.DirectoryName "*.dll") desktop/llama/
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "vcomp140.dll", "concrt140.dll") {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if ((Test-Path $src) -and -not (Test-Path "desktop/llama/$dll")) { Copy-Item $src desktop/llama/ }
          }
          Set-Content desktop/llama/VERSION.txt "llama.cpp $($rel.tagName)"
          & desktop/llama/llama-server.exe --version
          Get-ChildItem desktop/llama | Format-Table Name, Length -AutoSize

      - name: Construire l'installateur
        working-directory: desktop
        run: |
          npm ci
          npm run dist:win

      # Aucun installateur n'est publié si l'appli ne démarre pas ou si l'accueil affiche une erreur.
      - name: Vérifier que l'application démarre
        shell: pwsh
        env:
          VERIFIER_MODELE: ${{ (github.event_name != 'workflow_dispatch' || inputs.modele) && '1' || '0' }}
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          $exe = (Get-ChildItem desktop/dist/win-unpacked -Filter "Le r*.exe" | Select-Object -First 1).FullName
          node scripts/verifier-bureau.cjs "$exe"

      # Lancement comme un double-clic (sans outil de test), pour le journal de démarrage.
      - name: Lancer l'application comme un double-clic
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = (Get-ChildItem desktop/dist/win-unpacked -Filter "Le r*.exe" | Select-Object -First 1).FullName
          $journal = Join-Path $env:APPDATA "Le redacteur\journal.txt"
          Remove-Item $journal -ErrorAction SilentlyContinue
          Start-Process -FilePath $exe
          Start-Sleep -Seconds 45
          Get-Process | Where-Object { $_.Path -eq $exe } | Select-Object Id, MainWindowTitle, Responding | Format-Table -AutoSize
          Get-Content $journal -ErrorAction SilentlyContinue
          Get-Process | Where-Object { $_.Path -eq $exe } | Stop-Process -Force

      # Installation comme sur le poste de l'utilisateur ; l'installateur lance ensuite l'appli.
      - name: Installer comme l'utilisateur, puis ouvrir l'application
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $setup = (Get-ChildItem desktop/dist -Filter "Le-redacteur-Setup-*.exe" | Select-Object -First 1).FullName
          $journal = Join-Path $env:APPDATA "Le redacteur\journal.txt"
          Remove-Item $journal -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $setup -PassThru
          if (-not $p.WaitForExit(180000)) { "L'installateur ne se termine pas."; $p | Stop-Process -Force }
          "Code de sortie de l'installateur : $($p.ExitCode)"
          Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Depth 1 -Filter "*.exe" | Select-Object -ExpandProperty FullName
          Start-Sleep -Seconds 40
          Get-Process | Where-Object { $_.ProcessName -like "Le r*" } | Select-Object Id, MainWindowTitle, Responding | Format-Table -AutoSize
          Get-Content $journal -ErrorAction SilentlyContinue | Select-Object -Last 60
          Get-Process | Where-Object { $_.ProcessName -like "Le r*" } | Stop-Process -Force

      - name: Garder l'installateur comme artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Le-redacteur-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/verification.png

      - name: Publier dans une release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Le rédacteur ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          files: desktop/dist/*.exe
          body: |
            Installateur Windows de « Le rédacteur », rédacteur de courriers administratifs.

            Téléchargez `Le-redacteur-Setup-*.exe` ci-dessous, puis double-cliquez dessus.
            Windows peut afficher « Windows a protégé votre ordinateur » : cliquez sur « Informations complémentaires », puis « Exécuter quand même ».
