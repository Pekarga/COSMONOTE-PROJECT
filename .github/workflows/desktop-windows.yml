name: Installateur Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 0.1.0). Laisser vide pour ne pas publier de release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Construire l'appli web
        run: |
          npm ci
          npm run build
          npm run desktop:prepare

      - name: Construire l'installateur
        working-directory: desktop
        run: |
          npm ci
          npm run dist:win

      - name: Garder l'installateur comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: Le-redacteur-Windows
          path: desktop/dist/*.exe

      - name: Publier dans une release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Le rédacteur ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          files: desktop/dist/*.exe
          body: |
            Installateur Windows de « Le rédacteur ».

            Télécharge `Le-redacteur-Setup-*.exe` ci-dessous, puis double-clique dessus.
            Windows peut afficher « Windows a protégé votre ordinateur » : clique sur « Informations complémentaires », puis « Exécuter quand même ».
